<!DOCTYPE html>
<html>

<head>
    <title>Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="mb-4">

            <button id="btnFichajes" class="btn btn-outline-primary me-2" onclick="mostrarFichajes()">
                📊 Fichajes
            </button>

            <button id="btnUsuarios" class="btn btn-outline-secondary" onclick="mostrarUsuarios()">
                👤 Usuarios
            </button>

        </div>

        <div class="d-flex justify-content-between mb-4">
            <h2>Panel Admin</h2>
            <button onclick="logout()" class="btn btn-danger">Cerrar
                sesión</button>
        </div>

        <div id="seccionUsuarios">
            <div class="card p-4 shadow mb-4">
                <h4>Crear Usuario</h4>

                <div class="row">
                    <div class="col-md-3">
                        <input id="nombre" class="form-control" placeholder="Nombre">
                    </div>
                    <div class="col-md-3">
                        <input id="password" class="form-control" placeholder="Password">
                    </div>
                    <div class="col-md-2">
                        <input id="descanso" class="form-control" placeholder="Descanso">
                    </div>
                    <div class="col-md-2">
                        <select id="rol" class="form-select">
                            <option value="trabajador">Trabajador</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button onclick="crearUsuario()" class="btn btn-primary w-100">Crear</button>
                    </div>
                </div>


                <p id="msg" class="mt-2"></p>
            </div>
        </div>

        <!-- FILTRO -->
        <div id="seccionFichajes">
            <div class="card p-4 shadow mb-4">
                <h4>Fichajes</h4>

                <div class="row mb-3">
                    <div class="col-md-3">
                        <input type="date" id="inicio" class="form-control" max="">
                    </div>
                    <div class="col-md-3">
                        <input type="date" id="fin" class="form-control" max="">
                    </div>
                    <div class="col-md-3">
                        <button onclick="cargarFichajes()" class="btn btn-primary w-100">Buscar</button>
                    </div>
                    <div class="col-md-3">
                        <button onclick="exportarExcel()" class="btn btn-success w-100">Exportar
                            Excel</button>
                    </div>
                </div>

                <!-- TABLA -->
                <table class="table table-striped table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>Usuario</th>
                            <th>Fecha</th>
                            <th>Entrada</th>
                            <th>Salida</th>
                            <th>Horas</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaFichajes"></tbody>
                </table>

            </div>
        </div>

    </div>

    <script src="js/script.js"></script>

    <script>
        window.onload = () => {
            const hoy = new Date().toISOString().split("T")[0];

            document.getElementById("inicio").max = hoy;
            document.getElementById("fin").max = hoy;

            mostrarFichajes();
            cargarFichajes();
        }    
    </script>

</body>

</html>
