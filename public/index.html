<!DOCTYPE html>
<html>
    <head>
        <title>Login</title>
        <link rel="stylesheet" href="css/style.css">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
    </head>
    <body
        class="bg-light d-flex justify-content-center align-items-center vh-100">

        <div class="card p-4 shadow text-center"
            style="width: 320px; border-radius:15px;">

            <!-- LOGO -->
            <img src="assets/logo.svg" class="logo-login">
            
            <h3 class="mb-3">Login</h3>

            <input type="text" id="usuario" class="form-control mb-2" placeholder="Usuario">
            <input type="password" id="password" type="password" class="form-control mb-3"
                placeholder="Password">

            <button type="submit" onclick="login()"
                class="btn btn-primary w-100">Entrar</button>

            <p id="error" class="text-danger mt-2"></p>

        </div>

        <script src="js/script.js"></script>
    </body>
</html>
