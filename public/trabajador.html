<!DOCTYPE html>
<html>
    <head>
        <title>Trabajador</title>
        <link rel="stylesheet" href="css/style.css">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
    </head>
    <body class="bg-light">

        <div class="container mt-4">

            <div class="d-flex justify-content-between align-items-center mb-5">

    <div class="d-flex align-items-center gap-3">

        <img src="assets/logo.png" class="logo">

        <h2 class="m-0">Fichaje</h2>

    </div>

    <button onclick="logout()" class="btn btn-danger">Cerrar sesión</button>

</div>

            <div class="row justify-content-center text-center">
                <!-- ENTRADA -->
                <div class="col-md-5 mb-4">
                    <div class="card p-5 shadow tarjeta" onclick="entrada()">
                        <h3 class="text-success">Entrada</h3>
                        <p class="text-muted">Pulsa para fichar entrada</p>
                    </div>
                </div>

                <!-- SALIDA -->
                <div class="col-md-5 mb-4">
                    <div class="card p-5 shadow tarjeta" onclick="salida()">
                        <h3 class="text-primary">Salida</h3>
                        <p class="text-muted">Pulsa para fichar salida</p>
                    </div>
                </div>

            </div>

            <div id="resultado" class="mt-4 text-center fw-bold fs-5"></div>
        </div>

        <script src="js/script.js"></script>
    </body>
</html>
